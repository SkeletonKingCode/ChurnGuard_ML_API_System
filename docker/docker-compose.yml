services:
  churn-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: churn_api_service
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      - MODEL_VERSION=${MODEL_VERSION:-latest}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
